name = "notion_cli"
version = "0.1.0"
description = "Agent-facing Notion CLI: fetch pages as markdown (with block-id annotations) and check to_do checkboxes."
licences = ["Apache-2.0"]
target = "erlang"
gleam = ">= 1.15.0"

[dependencies]
gleam_stdlib = ">= 0.44.0 and < 2.0.0"
notion_client = { path = ".." }
argv = ">= 1.0.2 and < 2.0.0"
envoy = ">= 1.2.0 and < 2.0.0"
simplifile = ">= 2.4.0 and < 3.0.0"
gleam_http = ">= 4.3.0 and < 5.0.0"
gleam_json = ">= 3.1.0 and < 4.0.0"
gleam_erlang = ">= 1.3.0 and < 2.0.0"

[dev_dependencies]
gleeunit = ">= 1.0.0 and < 2.0.0"
